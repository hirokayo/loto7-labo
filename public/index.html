<script>
const API = window.location.origin;

let currentHistory = 0; // ← これ追加
let mode="";
let target="";
let selectedAnalysis = "";
let selectedRange = 0; 
let currentCheck = 0;

// =================
// ローディング
// =================
function showLoading(text){
  const o=document.getElementById("overlay");
  o.innerText=text;
  o.style.display="flex";
}
function hideLoading(){
  document.getElementById("overlay").style.display="none";
}

// =================
// 最新
// =================
async function loadLatest(){

  showLoading("読み込み中…");

  try{

    const res = await fetch(API + "/latest-result");

    if(!res.ok){
      throw new Error("APIエラー");
    }

    const d = await res.json();

    document.getElementById("latestBox").innerHTML = `

    <!-- タイトル -->
    <div style="margin-bottom:20px;">

      <h1 style="
        color:#b8860b;
        font-size:32px;
        margin-bottom:10px;
        text-shadow:
          0 0 5px #ffeb3b,
          0 0 10px #ff9800;
      ">
        抽選結果
      </h1>

      <p style="
        color:#5d4037;
        font-size:14px;
        font-weight:bold;
        line-height:1.7;
      ">
        ロト7の抽選結果です。<br>
        本数字・ボーナス数字を確認できます。
      </p>

    </div>

    <!-- 最新表示 -->
    <div style="margin-bottom:20px;">

      <div class="latest-badge">
        最新
      </div>

      <h2 style="
        margin-top:10px;
        color:#333;
        font-size:28px;
      ">
        第${d.round}回
      </h2>

    </div>

    <div class="numbers">
      ${renderNums(d.mainNumbers,"latest-main")}
    </div>

    <h3>ボーナス数字</h3>

    <div class="numbers">
      ${renderNums(d.bonusNumbers,"latest-bonus")}
    </div>

    `;

  }catch(e){

    console.error(e);

    document.getElementById("latestBox").innerHTML = `
      <p style="color:red;">
        最新データの取得に失敗しました
      </p>
    `;

  }finally{

    hideLoading();

  }
}

// =================
// 表示
// =================
function getColor(num){

  const colors = [
    "#e53935","#1e88e5","#43a047","#fdd835","#8e24aa",
    "#fb8c00","#00acc1","#6d4c41","#3949ab","#c0ca33",
    "#d81b60","#00897b","#7cb342","#5e35b1","#ef5350",
    "#039be5","#c2185b","#7b1fa2","#0288d1","#afb42b",
    "#f4511e","#6a1b9a","#00838f","#9e9d24","#ad1457",
    "#1565c0","#2e7d32","#f9a825","#4e342e","#283593",
    "#558b2f","#c62828","#0277bd","#6d4c41","#4527a0",
    "#2e7d32","#ff6f00"
  ];

  return colors[num - 1]; // ←ここ重要
}

// =============================
// 数字表示
// =============================
function renderNums(arr,type){
  return `<div class="numbers">`+
    arr.map(n=>`
      <span class="${type}">
        ${n}
      </span>
    `).join("")+
  `</div>`;
}

// =============================
// 回数表示
// =============================
function renderCount(arr,type){

  // データなし
  if(!arr || arr.length === 0){
    return "<p>該当した数字はありません</p>";
  }

  // 最大値取得
  const max = Math.max(...arr.map(d => d.count ?? d.gap));

  // HTML生成
  return `<div class="numbers">` +

    arr.map((d, index) => {

      // 回数取得
      const val = d.count ?? d.gap;

      let level;

      // =============================
      // コールド
      // =============================
      if(type.includes("cold")){

        if(val === 0){

          level = 5;

        }else{

          level = max > 0
            ? 6 - Math.ceil((val / max) * 5)
            : 1;
        }

      // =============================
      // ホット
      // コールドと同じ考え方
      // 同じ回数は同じ色
      // =============================
      }else if(type.includes("hot")){

        // 出現回数を重複なしで取得
        const uniqueCounts = [
          ...new Set(arr.map(x => x.count))
        ].sort((a,b)=>b-a);

        // 順位取得
        const rank = uniqueCounts.indexOf(val);

        // レベル決定
        level = 5 - rank;

        // 最低1
        if(level < 1){
          level = 1;
        }

      // =============================
      // その他
      // =============================
      }else{

        level = max > 0
          ? Math.ceil((val / max) * 5)
          : 1;
      }

      // HTML返す
      return `
        <span class="${type}${level}">
          ${d.num}
          <small>${val}回</small>
        </span>
      `;

    }).join("")

  + `</div>`;
}
    

// =============================
// 出現間隔ランキング表示
// =============================
function renderInterval(arr){

  // データがない場合
  if(!arr || arr.length === 0){

// =================

async function predict(){

  // =============================
  // ランダムで1つ選ぶ関数
  // =============================
  function randomPick(arr){
   return arr[Math.floor(Math.random() * arr.length)];
  }

  // =====================
  // 🔥 制限チェック
  // =====================
  const now = Date.now();

  // 5分リセット
  if(now - aiStartTime > 5 * 60 * 1000){
    aiCount = 0;
    aiStartTime = now;
  }

  if(aiCount >= 5){
    document.getElementById("ai").innerHTML = `
      <p class="error">予想は5回までです。</p>
    `;
    return;
  }

  aiCount++;

  showLoading("AIが予想中…");

  const start = Date.now();

  try{

    // =====================
    // 🔥 データ取得
    // =====================
    const res = await fetch(API + "/analyze-all");
    const allData = await res.json();

    const data = allData[50]["main"];

    const res2 = await fetch(API + "/all");
    const history = await res2.json();

    // =====================
    // 🔥 ① 分析データから2個
    // =====================
    // =====================
    // ホット 上位順位ベース
    // 最大5個
    // =====================

    // 出現回数ごとにグループ化
    const hotGroups = {};

    data.hot.forEach(d=>{

      if(!hotGroups[d.count]){
        hotGroups[d.count] = [];
      }

      hotGroups[d.count].push(d.num);

    });

    // 出現回数順
    const sortedCounts = Object.keys(hotGroups)
      .map(Number)
      .sort((a,b)=>b-a);

    // 最大5個
    let hot = [];

    for(const count of sortedCounts){

      const numsAtRank = hotGroups[count];

      // 5個超えるなら終了
      if(hot.length + numsAtRank.length > 5){
        break;
      }

      hot.push(...numsAtRank);
     }
        const cold = data.cold.slice(0,10).map(n=>n.num);

        const pick1 = randomPick(hot);
        const pick2 = randomPick(cold);

        // =====================
        // 🔥 ② 過去データから1個
        // =====================
        const recent = history.slice(0,20); // 直近20回

        const allNums = [];
        recent.forEach(d=>{
          allNums.push(...d.mainNumbers);
        });

        const pick3 = randomPick(allNums);

        // =====================
        // 🔥 ③ 残りランダム
        // =====================
        let result = [pick1, pick2, pick3];

        while(result.length < 7){
          const n = Math.floor(Math.random()*37)+1;
          if(!result.includes(n)){
            result.push(n);
          }
        }

        result = [...new Set(result)].sort((a,b)=>a-b);

        // ボタンを選択状態
        document.getElementById("aiBtn")
          .classList.add("active-ai");

    // =====================
    // 表示
    // =====================
    document.getElementById("ai").innerHTML = `
      <h3 style="margin-bottom:12px;">AI予想</h3>

      <div class="numbers">
        ${result.map(n => `
          <span class="ai-num">
            ${n}
          </span>
        `).join("")}
      </div>
    `;

    }catch(e){
      console.error(e);

      document.getElementById("ai").innerHTML = `
        <p class="error">AI予想エラー</p>
        <p style="font-size:12px;color:red;">${e.message}</p>
      `;
    }
  

  const elapsed = Date.now() - start;
  const wait = Math.max(1200 - elapsed, 0);
  await new Promise(r => setTimeout(r, wait));

  hideLoading();
}

function getHotNumbers(data, limitCount){

  const targetHot = data.hot.filter(
    n => n.count >= 3
  );

  return targetHot.slice(0, limitCount);
}

  const hitHot = nums.filter

        break;
      }
    }

    if(gap >= 0){

      html += `
        ${n}：${gap}回空き
        <br>
      `;

    }else{

      html += `
        ${n}：未出現
        <br>
      `;
    }

  });

  // =====================
  // ⚖️ 奇数・偶数
  // =====================
  const odd = nums.filter(n=>n%2 !== 0).length;
  const even = nums.length - odd;

  html += `
     <p class="check-box">
          ⚖️奇数偶数：${odd}-${even}
    </p>
  `;

  // =====================
  // 📊 合計値
  // =====================
  const sum = nums.reduce((a,b)=>a+b,0);

  // 中央値との差
  const diff = sum - data.median;

  html += `
    <p class="check-box">
      📊合計：${sum}
      （中央値${diff>=0?"+":""}${diff}）
    </p>
  `;

  // =====================
  // 🧱 ゾーン分析
  // =====================
  let zones=[0,0,0,0];

  nums.forEach(n=>{
    if(n<=10) zones[0]++;
    else if(n<=20) zones[1]++;
    else if(n<=30) zones[2]++;
    else zones[3]++;
  });

  const pattern = zones.join("-");

  html += `
    <p class="check-box">
          🧱ゾーン：${pattern}
    </p>
  `;

  // =====================
  // 表示
  // =====================
  html += `</div>`;

  document.getElementById("checkResult").innerHTML = html;
}

// =================
// 過去抽選表示
// =================
async function loadHistoryDraws(n, e){

    document.querySelectorAll(".history-btn").forEach(b=>b.classList.remove("active"));

  // 👇 今押したボタンだけactive
  e.target.classList.add("active");

  if(currentHistory === n){
    document.getElementById("pastDraws").innerHTML = "";
    currentHistory = 0;

     e.target.classList.remove("active"); // ←追加

    return;
  }

  showLoading("過去データ読み込み中…");

  try{

    const res = await fetch(API + "/all");

    if(!res.ok){
      throw new Error("APIエラー");
    }

    const all = await res.json();

    const clean = all.filter(d => d && d.round);
    
    // ※最新データを除外して表示（仕様）
    const target = clean
      .slice(1, n + 1)
      .map(d => ({
        ...d,
        round: d.round
      }));

    const countMap = {};
    target.forEach(d=>{
      [...d.mainNumbers, ...d.bonusNumbers].forEach(num=>{
        countMap[num] = (countMap[num] || 0) + 1;
      });
    });

    let html = `<h3>直近${n}回の抽選結果</h3>`;

  target.forEach(d=>{
  html += `
    <div style="margin:10px;padding:10px;border-bottom:1px solid #ddd;">
      
      <b>第${d.round}回</b>

      <div style="margin-top:5px;">
        <small class="label">本数字</small>
        ${renderHistoryNums(d.mainNumbers,"normal")}
      </div>

      <div style="margin-top:5px;">
        <small class="label">ボーナス数字</small>
        ${renderHistoryNums(d.bonusNumbers,"bonus",countMap)}
      </div>

    </div>
  `;
});  

    document.getElementById("pastDraws").innerHTML = html;

    // 👇 今表示している回数を記録
    currentHistory = n;

  }catch(e){
    console.error(e);
    document.getElementById("pastDraws").innerHTML = "取得エラー";
  }

  hideLoading();
}

// =============================
// 表示する個数を計算する関数
// =============================
// drawCount : 分析対象の回数（10回・20回など）
// percent   : 何％表示するか（今回は20%）
// max       : 上限（今回は5個）
function getLimit(drawCount, percent = 0.2, max = 5){

  // ① 抽選回数 × 20% で表示個数を計算
  let limit = Math.ceil(drawCount * percent);

  // ② 上限チェック（5個を超えたら5にする）
  if(limit > max){
    limit = max;
  }

  // ③ 最終的な表示個数を返す
  return limit;
}

// =================
// 数字選択モーダル（ここに追加）
// =================

// 👇ここに全部貼る
let selectedNums = [];

function openPicker(){
    const modal = document.getElementById("pickerModal");
    modal.style.display = "flex"; // ←ここで表示
    renderGrid();

     // エラー初期化
     document.getElementById("pickerError").innerText = "";
}

function closePicker(){
 document.getElementById("pickerModal").style.display = "none"; 
}

function renderGrid(){

  let html = "";

  for(let i=1;i<=37;i++){

    const active = selectedNums.includes(i);

    html += `
      <span onclick="toggleNum(${i})"
        style="
          background:${active ? '#ff7043' : '#90caf9'};
          color:white;
          margin:4px;
          padding:10px 12px;
          border-radius:50%;
          cursor:pointer;
          display:inline-block;
          min-width:32px;
          text-align:center;
        ">
        ${i}
      </span>
    `;
  }

  document.getElementById("numberGrid").innerHTML = html;

  // 🔥 選択中表示
  document.getElementById("selectedNums").innerText =
    selectedNums.length
      ? "選択中：" + selectedNums.sort((a,b)=>a-b).join(",")
      : "選択中：なし";

  // 🔥 残り表示（追加）
  document.getElementById("remainNums").innerText =
    `残り：${7 - selectedNums.length}個`;
}

function toggleNum(num){

  // エラー表示エリア取得
  const error = document.getElementById("pickerError");

  // すでに選択されている場合 → 解除
  if(selectedNums.includes(num)){
    selectedNums = selectedNums.filter(n=>n!==num);

    // エラー消す
    error.innerText = "";

  }else{

    // 7個以上選ぼうとした場合
    if(selectedNums.length >= 7){
      error.innerText = "7個までしか選べません";
      return;
    }

    // 追加
    selectedNums.push(num);

    // エラー消す
    error.innerText = "";
  }

  // 再描画
  renderGrid();
}

function clearNums(){
  selectedNums = [];
  renderGrid();
}

function applyNums(){

  const error = document.getElementById("pickerError");

  // 7個チェック
  if(selectedNums.length !== 7){
    error.innerText = "7個選んでください";
    return;
  }

  const sorted = selectedNums.sort((a,b)=>a-b);

  // メイン画面に表示
  const main = document.getElementById("selectedMainNums");
  if(main){
    main.innerHTML = sorted.map(n=>`
      <span class="normal">${n}</span>
    `).join("");
  }

  // 🔥 ここが重要（閉じる）
  closePicker();
}

// =============================
// 選択数字の表示切替 
// =============================
let selectedVisible = true;

function toggleSelected(event){

  const el = document.getElementById("selectedMainNums");
  const btn = event.target; // ←追加

  selectedVisible = !selectedVisible;

  el.style.display = selectedVisible ? "flex" : "none";

  btn.innerText = selectedVisible ? "閉じる" : "表示";
}

// =============================
// 分析結果の表示切替
// =============================
let resultVisible = true;

function toggleResult(event){

  const body = document.getElementById("resultBody");
  const btn = event.target;

  resultVisible = !resultVisible;

  body.style.display = resultVisible ? "block" : "none";

  btn.innerText = resultVisible ? "閉じる" : "表示";
}
